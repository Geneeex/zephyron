name: Verify analytical supplement

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out supporting files
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify publication file manifest
        run: python scripts/check_file_manifest.py
      - name: Install plotting dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify software, calculations and figures
        run: python scripts/verify_repository.py --figures
      - name: Retain verification results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: analytical-verification
          path: |
            build/reports/
            build/reproduced/
          if-no-files-found: warn
          retention-days: 14
